name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
categories:
  - title: "Breaking Changes"
    when:
      label: "breaking-change"
  - title: "Dependencies"
    collapse-after: 1
    when:
      label: "dependencies"

  # Version resolution. Order matters: `exclusive` stops later resolver
  # categories from matching the same PR, so dependency bumps always resolve
  # to patch even when Dependabot labels them `minor` or `major`.
  - type: "version-resolver"
    semver-increment: "patch"
    exclusive: true
    when:
      label: "dependencies"
  - type: "version-resolver"
    semver-increment: "major"
    when:
      labels:
        - "major"
        - "breaking-change"
  - type: "version-resolver"
    semver-increment: "minor"
    when:
      labels:
        - "minor"
        - "new-feature"
  - type: "version-resolver"
    semver-increment: "patch"

template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
